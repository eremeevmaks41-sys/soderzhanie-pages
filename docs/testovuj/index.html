<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оглавление</title>
<!-- ═════════════════════════════════════════════════════════════════
     «Оглавление телеграм-канала» · мини-апп
     Одна страница, без внешних зависимостей. Хостинг: GitHub Pages.
     Данные: docs/posts.json (обновляется автоматически Actions).
     Настройки: docs/config.js  (канал, цвет, лицензия).
     ═════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --card2:#f1ead9; --text:#2b2417; --muted:#8a7f68;
  --accent:#9a6b15; --accent-soft:#efe2c6; --chip:#efe8d8; --chip-active:#9a6b15;
  --chip-active-text:#fffdf8; --line:#e6dcc4; --search:#fffdf8; --shadow:0 2px 10px rgba(80,60,20,.07);
}
html[data-theme="dark"]{
  --bg:#1c1a16; --card:#26231d; --card2:#2e2a22; --text:#ece5d5; --muted:#9a917d;
  --accent:#d8b25e; --accent-soft:#3a3428; --chip:#2e2a22; --chip-active:#d8b25e;
  --chip-active-text:#1c1a16; --line:#3a352b; --search:#26231d; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 30px}

/* ── шапка ── */
header{display:flex;align-items:center;gap:12px;padding:10px 2px 14px}
.logo{
  width:46px;height:46px;border-radius:14px;flex:0 0 auto;
  background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
  font-size:24px;user-select:none;
}
.h-name{font-size:19px;font-weight:700;letter-spacing:.1px}
.h-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.h-open{
  margin-left:auto;flex:0 0 auto;text-decoration:none;font-size:13px;font-weight:600;
  color:var(--accent);border:1.5px solid var(--accent);border-radius:11px;padding:7px 12px;
}
.h-open:active{background:var(--accent-soft)}

/* ── поиск ── */
.search{position:relative;margin-bottom:10px}
.search input{
  width:100%;padding:11px 38px 11px 38px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--search);color:var(--text);font-size:15px;outline:none;
}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;font-size:15px}
.search .clr{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:var(--muted);font-size:17px;padding:6px 8px;cursor:pointer;display:none;
}

/* ── темы (чипсы) ── */
.chips{
  display:flex;gap:7px;overflow-x:auto;padding:2px 2px 12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1.5px solid var(--line);background:var(--chip);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--chip-active);color:var(--chip-active-text);border-color:var(--chip-active)}

/* ── даты и карточки ── */
.day{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;
}
.card:active{background:var(--card2)}
.c-top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.c-time{font-size:12px;color:var(--muted);flex:0 0 auto}
.c-title{font-size:15.5px;font-weight:700;line-height:1.35}
.c-prev{font-size:13.8px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.c-tag{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:2.5px 8px;font-weight:600}

/* ── переключатель вида: Оглавление / Лента ── */
.views{display:flex;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-bottom:11px}
.views button{
  flex:1;border:0;background:transparent;color:var(--muted);
  font-size:13.5px;font-weight:700;padding:8px 0;border-radius:9px;cursor:pointer;
}
.views button.active{background:var(--chip-active);color:var(--chip-active-text)}

/* ── сетка тем (настоящее оглавление) ── */
.slabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:15px 2px 9px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.tcard{
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:14px;cursor:pointer;box-shadow:var(--shadow);
}
.tcard:active{background:var(--card2)}
.t-ico{font-size:25px;line-height:1}
.t-title{font-size:14.5px;font-weight:700;margin-top:7px;line-height:1.3}
.t-n{font-size:12px;color:var(--muted);margin-top:3px}
.back{
  display:block;width:100%;margin:2px 0 10px;padding:10px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--chip);color:var(--text);
  font-size:13.5px;font-weight:700;cursor:pointer;text-align:center;
}


/* ── состояния ── */
.more{
  display:block;width:100%;margin:14px 0 4px;padding:12px;border-radius:13px;
  border:1.5px dashed var(--accent);background:transparent;color:var(--accent);
  font-size:14.5px;font-weight:700;cursor:pointer;
}
.state{padding:46px 20px;text-align:center;color:var(--muted)}
.state .big{font-size:40px;margin-bottom:10px}
.state .t{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.banner{
  display:none;background:#fdeaea;color:#8a2020;border:1px solid #f2c4c4;border-radius:12px;
  padding:10px 13px;font-size:13px;margin-bottom:10px;
}
html[data-theme="dark"] .banner{background:#3a2424;color:#e8b0b0;border-color:#5a3434}
.banner a{color:inherit;font-weight:700;text-decoration:underline}

/* ── футер (водяной знак) ── */
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
footer .lic{font-size:11px;opacity:.75}
</style>
<!-- ═══ МОСТ TELEGRAM — официальный и ОБЯЗАТЕЛЬНЫЙ (async) ═══
     core.telegram.org/bots/webapps → «Initializing Mini Apps»: скрипт
     telegram-web-app.js подключается в <head>. Без него
     window.Telegram.WebApp не создаётся у части клиентов (iPhone и др.) —
     тап по карточке поста молча ничего не открывает. Ровно это было
     причиной «не тапаются карточки поста» (12.9.2026).
     АТРИБУТ async (кейс босса «открывалось быстрее»): страница НЕ ждёт
     скрипт с telegram.org и рисуется мгновенно, мост доезжает параллельно;
     ядро ниже само подхватывает его готовность (adoptBridge + подписка
     load/error + страховочный таймер). ═══ -->
<script async src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">📖</div>
    <div>
      <div class="h-name" id="hName">Оглавление</div>
      <div class="h-sub" id="hSub">каталог постов канала</div>
    </div>
    <a class="h-open" id="hOpen" href="#">Канал</a>
  </header>

  <div class="banner" id="banner"></div>

  <div class="search">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="Поиск по оглавлению…" autocomplete="off">
    <button class="clr" id="clr" aria-label="Очистить">✕</button>
  </div>

  <div class="views" id="views" style="display:none">
    <button id="vToc" type="button">📖 Оглавление</button>
    <button id="vFeed" type="button">🕘 Лента</button>
  </div>

  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div id="state" class="state" style="display:none"></div>

  <footer>
    <div><b>Оглавление</b> · каталог постов Telegram-канала</div>
    <div class="lic" id="licLine"></div>
  </footer>
</div>

<script src="config.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   «Оглавление телеграм-канала» · ядро мини-аппа
   Порядок работы: config.js → лицензия → posts.json → рендер.
   Править этот файл не нужно: всё настраивается в config.js.
   ══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

var SALT = 'SODERZHANIE-v1-7f3a';               // служебная соль лицензии
var PAGE_SIZE = 100;                            // карточек за одну подгрузку
var cfg = window.SZ_CONFIG || {};

/* ── Telegram WebApp: тема и открытие ссылок ──
   Официальный скрипт (см. <head>) создаёт window.Telegram.WebApp и ВНЕ
   Telegram — но там он фиктивный: platform='unknown', postEvent уходит
   в никуда. Настоящий клиент всегда помечает мини-апп параметрами
   tgWebApp* в адресе страницы. Поэтому мостом считаем только настоящий
   контекст мини-аппа — иначе фиктивные вызовы в обычном браузере
   затмят рабочие обходные пути ниже. */
var rawTg = null, tg = null, bridgePending = true, bridgeTimer = null;
function adoptBridge(){
  rawTg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (!rawTg) return false;   /* скрипт ещё едет — остаёмся в режиме ожидания */
  var realBridge = (rawTg.platform && rawTg.platform !== 'unknown') ||
                   (rawTg.initData && String(rawTg.initData).length > 0) ||
                   /[?&#]tgWebApp/.test(window.location.href);
  if (!realBridge){
    bridgePending = false;   /* фиктивный — окончательно */
    diagNote('фиктивный WebApp (вне Telegram) — мост игнорирую');
    return false;
  }
  tg = rawTg; bridgePending = false;
  try { tg.ready(); tg.expand(); } catch(e){}
  themeApply();
  if (tg.onEvent) { try { tg.onEvent('themeChanged', themeApply); } catch(e){} }
  var late = document.getElementById('tgBanner');
  if (late && late.parentNode) late.parentNode.removeChild(late);
  diagNote('мост подключён (async): platform=' + (tg.platform || '?') + ' · ver=' + (tg.version || '?'));
  return true;
}
adoptBridge();
if (bridgePending && !rawTg){
  var settleBridge = function(){
    if (settleBridge.done) return;   /* финал фиксируется ровно один раз */
    settleBridge.done = true;
    bridgePending = false;
    clearTimeout(bridgeTimer);
    if (!tg && !rawTg) diagNote('мост не доехал (ошибка/таймаут) — открываю как обычная страница');
    maybeBridgeBanner();
  };
  var bridgeArrive = function(){
    clearTimeout(bridgeTimer);
    if (!tg) adoptBridge();
    settleBridge();
  };
  var bridgeEl = document.querySelector('script[src*="telegram-web-app.js"]');
  if (bridgeEl){
    bridgeEl.addEventListener('load', bridgeArrive);
    bridgeEl.addEventListener('error', settleBridge);
  } else { settleBridge(); }
  bridgeTimer = setTimeout(settleBridge, 3000);   /* скрипт завис: статус окончательный */
}

/* iOS Safari вешает :active только при обработчике touchstart */
document.addEventListener('touchstart', function(){}, {passive:true});

/* iOS/iPadOS: переходы через target="_blank" и window.open во встроенном
   браузере Telegram на iPhone блокируются молча — надёжные пути только
   официальный API мини-аппа или навигация в той же вкладке. */
var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); /* iPadOS 13+ маскируется под Mac */

function themeApply(){
  var p = (tg && tg.themeParams) || {};
  var dark = (tg && (p.bg_color ? isDark(p.bg_color) : (window.matchMedia('(prefers-color-scheme: dark)').matches)));
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  function isDark(hex){
    if (!hex) return false;
    var h = hex.replace('#','');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    return (0.299*r + 0.587*g + 0.114*b) < 128;
  }
}
if (!tg) themeApply();   /* без моста тема по системной настройке; с мостом применил adoptBridge */

/* ── самодиагностика в футере: записывает среду запуска и то, какая
   ветка открытия реально сработала — по ней пользователь может точно
   описать, что происходит на его устройстве ── */
var diagEl = null, diagLog = [];
function diagInit(){
  diagEl = document.createElement('div');
  diagEl.className = 'lic'; diagEl.id = 'diag';
  var f = document.querySelector('footer');
  if (f) f.appendChild(diagEl);
  diagNote('старт: tg=' + (tg
    ? 'да · platform=' + (tg.platform || '?') + ' · ver=' + (tg.version || '?')
    : (rawTg ? 'НЕТ (фиктивный WebApp вне Telegram — игнорирую)'
       : (bridgePending ? 'мост ещё грузится (async)…' : 'НЕТ — обычная страница, моста нет'))));
}
function diagNote(msg){
  if (!diagEl) return;
  var d = new Date(), z = function(x){ return ('0'+x).slice(-2); };
  diagLog.push(z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds())+' '+msg);
  if (diagLog.length > 4) diagLog = diagLog.slice(-4);
  diagEl.textContent = 'диагностика: ' + diagLog.join(' | ');
}

/* ── без моста Telegram (открытие не как мини-апп): изнутри страницы мост
   создать нельзя. Пугающую ошибку убрали (Task 114): веб-режим полноценно
   открывает посты той же вкладкой, факт режима виден в футере-диагностике ── */
function showBridgeBanner(){
  if (tg || !document.querySelector) return;
  if (document.getElementById('tgBanner')) return;   /* уже показан — не дублируем */
  /* Task 114: пугающего баннера больше нет — веб-режим полноценно открывает
     посты той же вкладкой (routeOpen); режим виден в диагностике футера */
  diagNote('веб-режим: посты открываются той же вкладкой');
}
/* async-мост мог ещё не доехать — раньше времени пугать пользователя нельзя:
   баннер показываем только когда статус моста окончательный */
function maybeBridgeBanner(){
  if (bridgePending) return;
  if (!tg) showBridgeBanner();
}

/* ── ОТКРЫТИЕ ПОСТОВ — стратегия живого приложения (проверена на
   iOS и Android, 2026-07):
     Telegram Desktop → tg.openTelegramLink (открывает внутри Telegram)
     Telegram Web     → window.open (новая вкладка браузера)
     Мобильные        → tg.openTelegramLink: переход прямо в канал,
                        мини-апп НЕ закрывается — Telegram сам показывает
                        пост поверх приложения; возврат свайпом или «Назад».
   Тихий случай (пост из того же канала, откуда открыт мини-апп):
   переход происходит корректно, НО без видимой смены экрана. Лечим по
   официальной документации: нативный уход приложения в фон фиксируем
   через visibilitychange; если за 1.5 с не свернулся:
     iOS  → WebApp.close(): пост уже открыт позади, close() его покажет
            (openLink вне жеста пользователя Telegram молча отбрасывает,
            а на iOS он ещё и открывает внешний Safari);
     иные → tg.openLink(): встроенный браузер, видимый рабочий путь. */
var TG_LINK_FALLBACK_MS = 1500;
function openInTelegram(url){
  var settled = false;
  function onVisChange(){
    if (document.hidden){
      settled = true;
      document.removeEventListener('visibilitychange', onVisChange);
      diagNote('приложение свернулось — пост открыт, назад свайпом');
    }
  }
  document.addEventListener('visibilitychange', onVisChange);
  try { tg.openTelegramLink(url); diagNote('openTelegramLink отправлен'); }
  catch(e){ diagNote('ошибка openTelegramLink: ' + (e && e.message ? e.message : '?')); }
  setTimeout(function(){
    document.removeEventListener('visibilitychange', onVisChange);
    if (settled) return;
    if (tg.platform === 'ios' && tg.close){
      diagNote('не свернулся за 1.5 с → close() (пост уже открыт позади)');
      try { tg.close(); } catch(e){}
      /* последний шанс, если close клиентом не поддержан */
      setTimeout(function(){
        if (!settled && tg.openLink){
          diagNote('close не сработал → openLink');
          try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
        }
      }, 800);
    } else if (tg.openLink){
      diagNote('не свернулся за 1.5 с → openLink');
      try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
    }
  }, TG_LINK_FALLBACK_MS);
}
function openUrl(url){
  if (!url) return;
  if (!tg && bridgePending){
    /* мост ещё едет (async): коротко дождёмся, чтобы тап не ушёл в запасную
       ветку раньше времени; если мост так и не приехал — прежние пути */
    diagNote('мост ещё грузится — жду его до 1.2 с');
    var t0 = Date.now();
    (function again(){
      if (tg){ diagNote('мост доехал — открываю штатно'); openUrl(url); return; }
      if (!bridgePending || Date.now() - t0 > 1200){ routeOpen(url); return; }
      setTimeout(again, 60);
    })();
    return;
  }
  routeOpen(url);
}
function routeOpen(url){
  if (!url) return;
  if (!tg){
    /* вне мини-аппа (в т.ч. встроенный браузер Telegram из кнопки канала):
       window.open блокируется молча — единственный надёжный путь везде —
       навигация в той же вкладке: в Telegram откроет пост прямо в приложении,
       в обычном браузере — страницу t.me с кнопкой «открыть в приложении» */
    diagNote('нет моста → навигация той же вкладкой');
    window.location.href = url;
    return;
  }
  var plat = tg.platform || '';
  /* Telegram Web (web/weba) — в новой вкладке браузера */
  if (plat === 'web' || plat === 'weba') { window.open(url, '_blank'); return; }
  /* нативные приложения (десктоп, macOS, iOS, Android) — прямо в
     Telegram через openTelegramLink, без внешнего браузера */
  var NATIVE_APP_PLATFORMS = {tdesktop:1, macos:1, ios:1, android:1, android_x:1};
  var canUseTelegramLink = !!tg.openTelegramLink
    && (!tg.isVersionAtLeast || tg.isVersionAtLeast('7.0'));
  if (NATIVE_APP_PLATFORMS[plat] && canUseTelegramLink) { openInTelegram(url); return; }
  /* неизвестная платформа или клиент старше Bot API 7.0 — старый добрый
     openLink(): гарантированно видимый рабочий путь */
  try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
}

/* ── лицензия: sha256(licensee|salt) первые 16 hex = ключ ── */
function hex(buf){
  var out = '';
  new Uint8Array(buf).forEach(function(b){ out += ('0'+b.toString(16)).slice(-2); });
  return out;
}
function licenseValid(licensee, key){
  if (!licensee || !key) return Promise.resolve(false);
  var data = new TextEncoder().encode(String(licensee).trim().toLowerCase() + '|' + SALT);
  if (!(window.crypto && crypto.subtle)) return Promise.resolve(false); // file:// — просто показываем баннер
  return crypto.subtle.digest('SHA-256', data).then(function(d){
    return ('SZ-' + hex(d).slice(0,16)).toUpperCase() === String(key).trim().toUpperCase();
  });
}

/* ── утилиты ── */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function dayLabel(iso){
  var d = new Date(iso + 'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  var yst = new Date(today.getTime() - 86400000);
  var t = new Date(d.getTime());
  if (t.getTime() === today.getTime()) return 'Сегодня';
  if (t.getTime() === yst.getTime()) return 'Вчера';
  var now = new Date();
  var label = d.getDate() + ' ' + MONTHS[d.getMonth()];
  if (d.getFullYear() !== now.getFullYear()) label += ' ' + d.getFullYear();
  return label;
}
function normTag(s){ return String(s||'').replace(/^#/,'').toLowerCase(); }

/* ── состояние приложения ── */
var POSTS = [];        // все посты (новые сверху)
var TAGS = [];         // [{tag, n}]
var TOPICS = null;     // [{id,title,icon,tags[]}] из topics.json (может не быть)
var TOC_ON = false;    // темы из topics.json реально покрывают посты
var view = 'feed';     // 'toc' | 'feed'
var filterTopic = null;// id выбранной темы (режим тем)
var filterMode = null; // универсальная группировка: 'months' | 'alpha' | 'kind'
var tocGroup = null;   // выбранная группа внутри filterMode
var filterTag = null;  // выбранный тег-фильтр (в виде «Лента»)
var filterQ = '';      // поисковая строка
var shown = PAGE_SIZE;

function topicOf(p){
  if (!TOPICS) return null;
  var pt = (p.tags||[]).map(normTag);
  for (var i = 0; i < TOPICS.length; i++){
    var tt = TOPICS[i].tags || [];
    for (var j = 0; j < tt.length; j++){
      if (pt.indexOf(normTag(tt[j])) !== -1) return TOPICS[i].id;
    }
  }
  return null;
}

/* ── универсальная группировка без тегов: месяцы / алфавит / тип постов ── */
var MODES = [
  {id:'months', icon:'📅', title:'По месяцам'},
  {id:'alpha',  icon:'🔤', title:'По алфавиту'},
  {id:'kind',   icon:'🎭', title:'По типу постов'}
];
var KIND_META = {
  text:{icon:'📝', title:'Тексты'}, photo:{icon:'📷', title:'Фото'},
  video:{icon:'🎬', title:'Видео'}, audio:{icon:'🎧', title:'Аудио'},
  poll:{icon:'📊', title:'Опросы'}, file:{icon:'📎', title:'Файлы'},
  sticker:{icon:'🎭', title:'Стикеры'}
};
function kindOf(p){
  if (p.kind && KIND_META[p.kind]) return p.kind;
  var t = p.title || '';
  if (t.indexOf('📷') === 0) return 'photo';
  if (t.indexOf('🎬') === 0) return 'video';
  if (t.indexOf('🎧') === 0) return 'audio';
  if (t.indexOf('📊') === 0) return 'poll';
  if (t.indexOf('📎') === 0) return 'file';
  return 'text';
}
function groupKey(p, mode){
  var md = mode || filterMode;
  if (md === 'months') return (p.date || '').slice(0,7);
  if (md === 'alpha'){
    var t = (p.title || '').replace(/^[^0-9a-zа-яё]+/i, '');
    return (t.charAt(0) || '#').toUpperCase();
  }
  return kindOf(p);
}
function monthLabel(ym){
  var m = parseInt(ym.slice(5,7), 10);
  return (MONTHS_NOM[m-1] || ym) + ' ' + ym.slice(0,4);
}
function groupCards(mode){
  var counts = {};
  POSTS.forEach(function(p){
    var k = groupKey(p, mode); if (!k) k = '#';
    if (!counts[k]) counts[k] = {key:k, n:0};
    counts[k].n++;
  });
  var arr = Object.keys(counts).map(function(k){ return counts[k]; });
  if (mode === 'months') arr.sort(function(a,b){ return a.key < b.key ? 1 : -1; });
  else if (mode === 'kind') arr.sort(function(a,b){ return b.n - a.n; });
  else arr.sort(function(a,b){ return a.key > b.key ? 1 : (a.key < b.key ? -1 : 0); });
  return arr;
}
function groupLabel(k){
  if (filterMode === 'months') return monthLabel(k);
  if (filterMode === 'kind') return (KIND_META[k] || {title:'Тексты'}).title;
  return 'На «' + k + '»';
}
function groupIcon(k){
  if (filterMode === 'months') return '📅';
  if (filterMode === 'kind') return (KIND_META[k] || {icon:'📝'}).icon;
  return k; // алфавит: буква сама — иконка
}

/* ── фильтрация и рендер ── */
function pluralWord(n, forms){
  var a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return forms[0];
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return forms[1];
  return forms[2];
}
function plural(n){ return pluralWord(n, ['пост','поста','постов']); }
function filtered(){
  var q = filterQ.trim().toLowerCase();
  var inToc = view === 'toc' && !filterQ.trim();
  return POSTS.filter(function(p){
    if (inToc && filterTopic){
      var t = topicOf(p) || '__misc';
      if (t !== filterTopic) return false;
    } else if (inToc && filterMode && tocGroup){
      if (groupKey(p) !== tocGroup) return false;
    } else if (filterTag && !(p.tags||[]).some(function(t){ return normTag(t) === filterTag; })) return false;
    if (!q) return true;
    var hay = ((p.title||'') + ' ' + (p.preview||'') + ' ' + (p.tags||[]).join(' ')).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}
function renderChips(){
  var box = document.getElementById('chips');
  box.innerHTML = '';
  var chipAll = document.createElement('div');
  chipAll.className = 'chip' + (filterTag ? '' : ' active');
  chipAll.textContent = 'Все темы';
  chipAll.onclick = function(){ filterTag = null; shown = PAGE_SIZE; render(); };
  box.appendChild(chipAll);
  TAGS.slice(0, 14).forEach(function(t){
    var c = document.createElement('div');
    c.className = 'chip' + (filterTag === normTag(t.tag) ? ' active' : '');
    c.textContent = t.tag + ' · ' + t.n;
    c.onclick = function(){
      filterTag = (filterTag === normTag(t.tag)) ? null : normTag(t.tag);
      shown = PAGE_SIZE; render();
    };
    box.appendChild(c);
  });
}
/* ── вид «Оглавление»: темы либо универсальные разделы + возврат ── */
function renderViews(){

var TAG_ICONS = {
  russia:'🇷🇺', россия:'🇷🇺', worldnews:'🌍', мировыеновости:'🌍',
  conflict:'⚔️', конфликт:'⚔️', society:'🏙️', общество:'🏙️',
  economy:'📈', экономика:'📈', politics:'🏛️', политика:'🏛️',
  health:'🏥', здоровье:'🏥', science:'🔬', наука:'🔬',
  energy:'⚡', энергетика:'⚡', sport:'⚽', спорт:'⚽',
  technology:'💻', технологии:'💻', culture:'🎭', культура:'🎭',
  family:'👨‍👩‍👧', семья:'👨‍👩‍👧', incident:'🚨', происшествия:'🚨'
};
function tagIcon(tag){
  return TAG_ICONS[normTag(tag)] || '🏷️';
}
function topicCardCount(){
  if (TOPICS){
    var n = 0, covered = 0;
    TOPICS.forEach(function(t){
      var c = 0;
      POSTS.forEach(function(p){ if (topicOf(p) === t.id) c++; });
      if (c) n++;
      covered += c;
    });
    if (covered > 0){
      var misc = POSTS.length - covered, total = n + (misc > 0 ? 1 : 0);
      return { n: total, word: pluralWord(total, ['тема','темы','тем']) };
    }
  }
  return { n: TAGS.length, word: pluralWord(TAGS.length, ['тег','тега','тегов']) };
}
/* ── экран «По темам» (v54-ru): карточки тем из topics.json (если реально
   покрывают посты) + каждый тег постов своей карточкой. Тап по карточке —
   отфильтрованный список постов. ── */
function renderTopicsScreen(){
  showBack('← Оглавление', function(){ filterMode = null; filterTopic = null; filterTag = null; tocGroup = null; shown = PAGE_SIZE; render(); });
  renderState(null);
  var list = document.getElementById('list');
  var html = '';
  if (TOPICS){
    var covered = 0, misc = 0;
    POSTS.forEach(function(p){ if (topicOf(p)) covered++; else misc++; });
    if (covered > 0){
      html += '<div class="tgrid">';
      TOPICS.forEach(function(t){
        var n = 0;
        POSTS.forEach(function(p){ if (topicOf(p) === t.id) n++; });
        if (!n) return;
        html += '<div class="tcard" data-topic="' + esc(t.id) + '">' +
                  '<div class="t-ico">' + esc(t.icon || '🏷') + '</div>' +
                  '<div class="t-title">' + esc(t.title || t.id) + '</div>' +
                  '<div class="t-n">' + n + ' ' + plural(n) + '</div>' +
                '</div>';
      });
      if (misc){
        html += '<div class="tcard" data-topic="__misc">' +
                  '<div class="t-ico">🗂</div>' +
                  '<div class="t-title">Разное</div>' +
                  '<div class="t-n">' + misc + ' ' + plural(misc) + '</div>' +
                '</div>';
      }
      html += '</div>';
    }
  }
  if (TAGS.length){
    html += '<div class="slabel">Все темы</div><div class="tgrid">';
    TAGS.forEach(function(t){
      var nt = normTag(t.tag);
      html += '<div class="tcard" data-ttag="' + esc(nt) + '">' +
                '<div class="t-ico">' + esc(tagIcon(t.tag)) + '</div>' +
                '<div class="t-title">' + esc(t.tag) + '</div>' +
                '<div class="t-n">' + t.n + ' ' + plural(t.n) + '</div>' +
              '</div>';
    });
    html += '</div>';
  }
  if (!html) return renderState('empty');
  list.innerHTML = html;
  list.style.display = '';
  list.querySelectorAll('.tcard[data-topic]').forEach(function(el){
    el.addEventListener('click', function(){
      filterTopic = el.getAttribute('data-topic');
      shown = PAGE_SIZE; render();
      window.scrollTo(0, 0);
    });
  });
  list.querySelectorAll('.tcard[data-ttag]').forEach(function(el){
    el.addEventListener('click', function(){
      filterTag = el.getAttribute('data-ttag');
      shown = PAGE_SIZE; render();
      window.scrollTo(0, 0);
    });
  });
  var more = document.getElementById('moreBtn');
  if (more) more.style.display = 'none';
}
function renderModeGrid(){
  hideBack();
  renderState(null);
  var list = document.getElementById('list');
  /* v54-ru: корень оглавления — ВСЕГДА четыре равные карточки:
     три универсальные (месяцы/алфавит/типы) + «По темам» (темы и теги).
     Карточки никогда не пропадают и не смешиваются с содержимым разделов. */
  var html = '<div class="tgrid">';
  MODES.forEach(function(m){
    var gn = groupCards(m.id).length;
    html += '<div class="tcard" data-mode="' + m.id + '">' +
              '<div class="t-ico">' + m.icon + '</div>' +
              '<div class="t-title">' + m.title + '</div>' +
              '<div class="t-n">' + gn + ' ' + pluralWord(gn, ['раздел','раздела','разделов']) + '</div>' +
            '</div>';
  });
  var tn = topicCardCount();
  html += '<div class="tcard" data-mode="topics">' +
            '<div class="t-ico">🏷</div>' +
            '<div class="t-title">По темам</div>' +
            '<div class="t-n">' + tn.n + ' ' + tn.word + '</div>' +
          '</div>';
  html += '</div>';
  list.innerHTML = html;
  list.style.display = '';
  list.querySelectorAll('.tcard').forEach(function(el){
    el.addEventListener('click', function(){
      filterMode = el.getAttribute('data-mode');   // 'months' | 'alpha' | 'kind' | 'topics'
      tocGroup = null; shown = PAGE_SIZE; render();
      window.scrollTo(0, 0);
    });
  });
  var more = document.getElementById('moreBtn');
  if (more) more.style.display = 'none';
}
function renderGroupCards(){
  showBack('← Оглавление',
           function(){ filterMode = null; tocGroup = null; shown = PAGE_SIZE; render(); });
  renderState(null);
  var list = document.getElementById('list');
  var cards = groupCards(filterMode);
  var html = '<div class="tgrid">';
  cards.forEach(function(c){
    html += '<div class="tcard" data-group="' + esc(c.key) + '">' +
              '<div class="t-ico">' + esc(groupIcon(c.key)) + '</div>' +
              '<div class="t-title">' + esc(groupLabel(c.key)) + '</div>' +
              '<div class="t-n">' + c.n + ' ' + plural(c.n) + '</div>' +
            '</div>';
  });
  html += '</div>';
  list.innerHTML = html;
  list.style.display = '';
  list.querySelectorAll('.tcard').forEach(function(el){
    el.addEventListener('click', function(){
      tocGroup = el.getAttribute('data-group');
      shown = PAGE_SIZE; render();
      window.scrollTo(0, 0);
    });
  });
  var more = document.getElementById('moreBtn');
  if (more) more.style.display = 'none';
}
function renderList(items){
  var list = document.getElementById('list');
  var html = '', lastDay = '', groupOpen = false;
  items.slice(0, shown).forEach(function(p){
    if (p.date !== lastDay){
      if (groupOpen){ html += '</div>'; }
      html += '<div class="day">' + esc(dayLabel(p.date)) + '</div><div class="group">';
      lastDay = p.date; groupOpen = true;
    }
    var tags = (p.tags||[]).map(function(t){ return '<span class="c-tag">' + esc(t) + '</span>'; }).join('');
    html += '<div class="card" data-url="' + esc(p.url||'') + '">' +
              '<div class="c-top">' +
                (p.time ? '<span class="c-time">' + esc(p.time) + '</span>' : '') +
                '<span class="c-title">' + esc(p.title || 'Пост') + '</span>' +
              '</div>' +
              (p.preview ? '<div class="c-prev">' + esc(p.preview) + '</div>' : '') +
              (tags ? '<div class="c-tags">' + tags + '</div>' : '') +
            '</div>';
  });
  if (groupOpen) html += '</div>';
  list.innerHTML = html;
  list.querySelectorAll('.card').forEach(function(el){
    el.addEventListener('click', function(){ openUrl(el.getAttribute('data-url')); });
  });
  var more = document.getElementById('moreBtn');
  if (items.length > shown){
    if (!more){
      more = document.createElement('button');
      more.id = 'moreBtn'; more.className = 'more';
      more.onclick = function(){ shown += PAGE_SIZE; render(); };
      document.getElementById('list').after(more);
    }
    more.textContent = 'Показать ещё (' + (items.length - shown) + ')';
    more.style.display = 'block';
  } else if (more){ more.style.display = 'none'; }
}
function renderState(kind, extra){
  var st = document.getElementById('state');
  var list = document.getElementById('list');
  var more = document.getElementById('moreBtn');
  if (more) more.style.display = 'none';
  if (!kind){ st.style.display = 'none'; list.style.display = ''; return; }
  list.style.display = 'none';
  st.style.display = 'block';
  if (kind === 'empty')   st.innerHTML = '<div class="big">📭</div><div class="t">Пока пусто</div><div>Посты появятся здесь сразу после первой публикации или импорта.</div>';
  if (kind === 'nomatch') st.innerHTML = '<div class="big">🔍</div><div class="t">Ничего не найдено</div><div>Попробуйте изменить запрос или выбрать другую тему.</div>';
  if (kind === 'error')   st.innerHTML = '<div class="big">⚠️</div><div class="t">Не удалось загрузить оглавление</div><div>' + esc(extra||'') + '</div>';
}
function render(){
  var items = filtered();
  var q = filterQ.trim();
  var inToc = view === 'toc' && !q;
  var sub = POSTS.length ? ('каталог постов · ' + POSTS.length + ' шт.') : 'каталог постов канала';
  if (inToc && filterMode && filterMode !== 'topics' && !tocGroup){
    var gn = groupCards().length;
    sub = gn + ' ' + pluralWord(gn, ['раздел','раздела','разделов']);
  } else if (inToc && filterMode === 'topics' && !filterTopic && !filterTag){
    var tc = topicCardCount();
    sub = tc.n + ' ' + tc.word;
  }
  document.getElementById('hSub').textContent = sub;
  renderViews();
  document.getElementById('chips').style.display = inToc ? 'none' : '';
  if (!POSTS.length){ renderChips(); return renderState('empty'); }
  if (inToc && !filterMode && !filterTopic && !tocGroup && !filterTag){ renderModeGrid(); return; }  // v54-ru корень: 4 карточки
  if (inToc && filterMode === 'topics' && !filterTopic && !filterTag){ renderTopicsScreen(); return; }
  if (inToc && filterMode && filterMode !== 'topics' && !tocGroup){ renderGroupCards(); return; }
  if (inToc && filterTopic){
    showBack('← По темам', function(){ filterTopic = null; shown = PAGE_SIZE; render(); });
  } else if (inToc && filterMode && tocGroup){
    var bm = MODES.filter(function(m){ return m.id === filterMode; })[0];
    showBack('← ' + (bm ? bm.title : 'Разделы'),
             function(){ tocGroup = null; shown = PAGE_SIZE; render(); });
  } else if (inToc && filterTag){
    showBack('← По темам', function(){ filterTag = null; shown = PAGE_SIZE; render(); });
  } else { hideBack(); }
  renderChips();
  if (!items.length) return renderState('nomatch');
  renderState(null);
  renderList(items);
  document.getElementById('list').style.display = '';
}

/* ── загрузка данных ── */
var RAW_TOPICS = null;    // содержимое topics.json (если есть)
var POSTS_READY = false;  // posts.json загружен
function tryApplyTopics(){
  if (!RAW_TOPICS || !POSTS_READY) return;
  var ts = (RAW_TOPICS && RAW_TOPICS.topics) || [];
  TOPICS = ts.filter(function(t){ return t && t.id && (t.tags||[]).length; });
  TOC_ON = false;
  if (!TOPICS.length){ TOPICS = null; render(); return; }
  var covered = POSTS.filter(function(p){ return topicOf(p); }).length;
  TOC_ON = covered > 0;
  render();   // темы не покрывают посты — корень оглавления покажет универсальные разделы
}
function loadTopics(){
  fetch('topics.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){ RAW_TOPICS = data; tryApplyTopics(); })
    .catch(function(){ render(); });   // topics.json нет — остаётся вид «Лента»
}
function boot(data){
  var posts = Array.isArray(data) ? data : (data.posts || []);
  POSTS = posts.map(function(p){
    var d = String(p.date || '');
    return {
      date: d.slice(0,10), time: String(p.time || (d.length > 10 ? d.slice(11,16) : '')),
      title: p.title || '', preview: p.preview || '',
      tags: p.tags || [], kind: p.kind || '', url: p.url || ''
    };
  }).sort(function(a,b){
    var ka = a.date + ' ' + a.time, kb = b.date + ' ' + b.time;
    return ka < kb ? 1 : (ka > kb ? -1 : 0);
  });
  if (cfg.default_view !== 'feed') view = 'toc';   // по умолчанию — оглавление
  var counts = {};
  POSTS.forEach(function(p){ (p.tags||[]).forEach(function(t){
    var k = normTag(t); if (!k) return;
    if (!counts[k]) counts[k] = {tag: t.replace(/^#/,'') ? t : t, n: 0};
    counts[k].n++;
  });});
  TAGS = Object.keys(counts).map(function(k){ return counts[k]; })
    .sort(function(a,b){ return b.n - a.n; });
  POSTS_READY = true;
  render();
  tryApplyTopics();
}

function load(){
  var url = 'posts.json?v=' + Date.now();
  fetch(url, {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(boot)
    .catch(function(e){ renderState('error', 'Файл posts.json недоступен или пуст. Проверьте настройку по гайду (' + e.message + ').'); });
}

/* ── старт ── */
applyConfig();
diagInit();
maybeBridgeBanner();
licenseValid(cfg.licensee, cfg.license_key).then(function(ok){
  if (!ok){
    var b = document.getElementById('banner');
    b.style.display = 'block';
    b.textContent = 'Лицензионный ключ не подтверждён. Работает демонстрационный режим — впишите корректные данные в config.js или обратитесь к продавцу.';
  }
});
load();
loadTopics();
})();
</script>
