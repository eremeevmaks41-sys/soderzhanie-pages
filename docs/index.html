<script>
/* SZ-APP-SHELL v1 (Task 116/117) — один мини-апп на всех клиентов подписочной ветки.
   Telegram запускает мини-апп с параметром startapp=<канал>; до загрузки
   config.js/posts.json подставляем <base> на папку тенанта — дальше шаблон
   работает как обычно, у каждого клиента своя страница. Слаг канала жёстко
   фильтруется: a-z0-9_, 3–64 символа. Без параметра (t.me «Open app»,
   меню-кнопка) показываем демо-канал (Task 117).
   Пересборка: scripts/build_app_shell.py */
window.__TOC_DEFAULT = 'testovuj';
(function () {
  function sp() {
    try {
      var q = new URLSearchParams(location.search);
      var p = q.get('tgWebAppStartParam') || q.get('startapp');
      if (p) return p;
      var h = location.hash.match(/(?:tgWebAppStartParam|startapp)=([^&]+)/);
      if (h) return decodeURIComponent(h[1]);
      var w = window.Telegram && window.Telegram.WebApp;
      if (w && w.initDataUnsafe && w.initDataUnsafe.start_param) {
        return w.initDataUnsafe.start_param;
      }
    } catch (e) {}
    return '';
  }
  /* Task 132: сырой параметр сохраняется — из него кабинет берёт токен
     (_cab_<uid>_<exp>_<sig>), когда мост Telegram недоступен (initData пуст). */
  window.__TOC_STARTPARAM = String(sp() || '');
  var ch = window.__TOC_STARTPARAM.toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!ch) ch = String(window.__TOC_DEFAULT || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
  window.__TOC_CHANNEL = ch;
  if (ch.length >= 3 && ch.length <= 64) {
    var b = document.createElement('base');
    b.href = 'https://eremeevmaks41-sys.github.io/soderzhanie-pages/' + ch + '/';
    document.head.appendChild(b);
  }
})();
</script>

<script>
/* SZ-CAB prelude (Task 129): startapp=_cab — режим личного кабинета.
   Каналы Telegram не начинаются с «_», поэтому конфликт с папками тенантов
   невозможен. Task 132: кабинет распознаётся и по префиксу _cab_ — так в
   startapp приезжает подписанный токен пользователя для контекстов без
   initData (браузерный фолбэк Direct-Link). <base> в кабинете НЕ ставится:
   витринные config.js/posts.json не грузятся (гарант ниже в этом режиме
   молчит), а витринный DOM прячем стилем заранее — до запуска ядра и
   кабинета. */
var __cabCh = String(window.__TOC_CHANNEL || '');
if (__cabCh === '_cab' || __cabCh.indexOf('_cab_') === 0) {
  window.__TOC_CABINET = true;
  (function () {
    try {
      var st = document.createElement('style');
      st.id = 'sz-cab-hide';
      st.textContent = '.wrap,header,.banner{display:none!important}'
        + '#sz-cab a{overflow-wrap:anywhere;word-break:break-word}';
      (document.head || document.documentElement).appendChild(st);
    } catch (e) {}
  })();
}
</script>

}

/* SZ-APP-SHELL guard (Task 119): config.js не доехал (папки канала нет) —
   честный экран. Проверяем РОВНО тот глобал, который пишет генератор config.js
   (trialbuild.py → window.SZ_CONFIG; раньше проверялся выдуманный
   SODERZHANIE_CONFIG — гарант срабатывал на КАЖДОМ открытии мини-аппа).

if (!window.SZ_CONFIG && !window.__TOC_CABINET) {
  (function () {
    try {
      var w = window.Telegram && window.Telegram.WebApp;
      var late = w && w.initDataUnsafe && w.initDataUnsafe.start_param;
      if (late && ('' + late).length <= 64
          && location.search.indexOf('tgWebAppStartParam=') === -1) {
        location.replace('?tgWebAppStartParam=' + encodeURIComponent(late));
      }
    } catch (e) {}
  })();
  (function () {
    try {
      var wrapEl = document.querySelector('.wrap');
      if (wrapEl && wrapEl.parentNode) wrapEl.parentNode.removeChild(wrapEl);
      var d = document.createElement('div');

   «Оглавление телеграм-канала» · ядро мини-аппа
   Порядок работы: config.js → лицензия → posts.json → рендер.
   Править этот файл не нужно: всё настраивается в config.js.
   ══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

var SALT = 'SODERZHANIE-v1-7f3a';               // служебная соль лицензии
var PAGE_SIZE = 100;                            // карточек за одну подгрузку
var cfg = window.SZ_CONFIG || {};

/* ── Telegram WebApp: тема и открытие ссылок ──
   Официальный скрипт (см. <head>) создаёт window.Telegram.WebApp и ВНЕ
   Telegram — но там он фиктивный: platform='unknown', postEvent уходит
   в никуда. Настоящий клиент всегда помечает мини-апп параметрами
   tgWebApp* в адресе страницы. Поэтому мостом считаем только настоящий
   контекст мини-аппа — иначе фиктивные вызовы в обычном браузере
   затмят рабочие обходные пути ниже. */
var rawTg = null, tg = null, bridgePending = true, bridgeTimer = null;
function adoptBridge(){
  rawTg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (!rawTg) return false;   /* скрипт ещё едет — остаёмся в режиме ожидания */
  var realBridge = (rawTg.platform && rawTg.platform !== 'unknown') ||
                   (rawTg.initData && String(rawTg.initData).length > 0) ||
                   /[?&#]tgWebApp/.test(window.location.href);
  if (!realBridge){
    bridgePending = false;   /* фиктивный — окончательно */
    diagNote('фиктивный WebApp (вне Telegram) — мост игнорирую');
    return false;
  }
  tg = rawTg; bridgePending = false;
  try { tg.ready(); tg.expand(); } catch(e){}
  themeApply();
  headerColorApply();
  wireTgBack();   /* кнопка «Назад» ставится на старте — при позднем приходе моста ставим снова */
  if (tg.onEvent) { try { tg.onEvent('themeChanged', function(){ themeApply(); headerColorApply(); }); } catch(e){} }
  var late = document.getElementById('tgBanner');
  if (late && late.parentNode) late.parentNode.removeChild(late);
  diagNote('мост подключён (async): platform=' + (tg.platform || '?') + ' · ver=' + (tg.version || '?'));
  return true;
}
adoptBridge();
if (bridgePending && !rawTg){
  var settleBridge = function(){
    if (settleBridge.done) return;   /* финал фиксируется ровно один раз */
    settleBridge.done = true;
    bridgePending = false;
    clearTimeout(bridgeTimer);
    if (!tg && !rawTg) diagNote('мост не доехал (ошибка/таймаут) — открываю как обычная страница');
    maybeBridgeBanner();
  };
  var bridgeArrive = function(){
    clearTimeout(bridgeTimer);
    if (!tg) adoptBridge();
    settleBridge();
  };
  var bridgeEl = document.querySelector('script[src*="telegram-web-app.js"]');
  if (bridgeEl){
    bridgeEl.addEventListener('load', bridgeArrive);
    bridgeEl.addEventListener('error', settleBridge);
  } else { settleBridge(); }
  bridgeTimer = setTimeout(settleBridge, 3000);   /* скрипт завис: статус окончательный */
}

    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);

/* ── ОТКРЫТИЕ ПОСТОВ — стратегия живого приложения (проверена на
   iOS и Android, 2026-07):
     Telegram Desktop → tg.openTelegramLink (открывает внутри Telegram)
     Telegram Web     → window.open (новая вкладка браузера)
     Мобильные        → tg.openTelegramLink: переход прямо в канал,
                        мини-апп НЕ закрывается — Telegram сам показывает
                        пост поверх приложения; возврат свайпом или «Назад».
   Тихий случай (пост из того же канала, откуда открыт мини-апп):
   переход происходит корректно, НО без видимой смены экрана. Лечим по
   официальной документации: нативный уход приложения в фон фиксируем
   через visibilitychange; если за 1.5 с не свернулся:
     iOS  → WebApp.close(): пост уже открыт позади, close() его покажет
            (openLink вне жеста пользователя Telegram молча отбрасывает,
            а на iOS он ещё и открывает внешний Safari);
     иные → tg.openLink(): встроенный браузер, видимый рабочий путь. */
var TG_LINK_FALLBACK_MS = 1500;
function openInTelegram(url){
  var settled = false;
  function onVisChange(){
    if (document.hidden){
      settled = true;
      document.removeEventListener('visibilitychange', onVisChange);
      diagNote('приложение свернулось — пост открыт, назад свайпом');
    }
  }
  document.addEventListener('visibilitychange', onVisChange);
  try { tg.openTelegramLink(url); diagNote('openTelegramLink отправлен'); }
  catch(e){ diagNote('ошибка openTelegramLink: ' + (e && e.message ? e.message : '?')); }
  setTimeout(function(){
    document.removeEventListener('visibilitychange', onVisChange);
    if (settled) return;
    if (tg.platform === 'ios' && tg.close){
      diagNote('не свернулся за 1.5 с → close() (пост уже открыт позади)');
      try { tg.close(); } catch(e){}
      /* последний шанс, если close клиентом не поддержан */
      setTimeout(function(){
        if (!settled && tg.openLink){
          diagNote('close не сработал → openLink');
          try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
        }
      }, 800);
    } else if (tg.openLink){
      diagNote('не свернулся за 1.5 с → openLink');
      try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
    }
  }, TG_LINK_FALLBACK_MS);
}
function openUrl(url){
  if (!url) return;
  if (!tg && bridgePending){
    /* мост ещё едет (async): коротко дождёмся, чтобы тап не ушёл в запасную
       ветку раньше времени; если мост так и не приехал — прежние пути */
    diagNote('мост ещё грузится — жду его до 1.2 с');
    var t0 = Date.now();
    (function again(){
      if (tg){ diagNote('мост доехал — открываю штатно'); openUrl(url); return; }
      if (!bridgePending || Date.now() - t0 > 1200){ routeOpen(url); return; }
      setTimeout(again, 60);
    })();
    return;
  }
  routeOpen(url);
}
function routeOpen(url){
  if (!url) return;
  if (!tg){
    /* вне мини-аппа (в т.ч. встроенный браузер Telegram из кнопки канала):
       window.open блокируется молча — единственный надёжный путь везде —
       навигация в той же вкладке: в Telegram откроет пост прямо в приложении,
       в обычном браузере — страницу t.me с кнопкой «открыть в приложении» */
    diagNote('нет моста → навигация той же вкладкой');
    window.location.href = url;
    return;
  }
  var plat = tg.platform || '';
  /* Telegram Web (web/weba) — в новой вкладке браузера */
  if (plat === 'web' || plat === 'weba') { window.open(url, '_blank'); return; }
  /* нативные приложения (десктоп, macOS, iOS, Android) — прямо в
     Telegram через openTelegramLink, без внешнего браузера */
  var NATIVE_APP_PLATFORMS = {tdesktop:1, macos:1, ios:1, android:1, android_x:1};
  var canUseTelegramLink = !!tg.openTelegramLink
    && (!tg.isVersionAtLeast || tg.isVersionAtLeast('7.0'));
  if (NATIVE_APP_PLATFORMS[plat] && canUseTelegramLink) { openInTelegram(url); return; }
  /* неизвестная платформа или клиент старше Bot API 7.0 — старый добрый
     openLink(): гарантированно видимый рабочий путь */
  try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
}

/* ── лицензия: sha256(licensee|salt) первые 16 hex = ключ ── */
function hex(buf){
  var out = '';
  new Uint8Array(buf).forEach(function(b){ out += ('0'+b.toString(16)).slice(-2); });
  return out;
}
function licenseValid(licensee, key){
  if (!licensee || !key) return Promise.resolve(false);
  var data = new TextEncoder().encode(String(licensee).trim().toLowerCase() + '|' + SALT);
  if (!(window.crypto && crypto.subtle)) return Promise.resolve(false); // file:// — просто показываем баннер
  return crypto.subtle.digest('SHA-256', data).then(function(d){
    return ('SZ-' + hex(d).slice(0,16)).toUpperCase() === String(key).trim().toUpperCase();
  });
}

  });
}
var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function dayLabel(iso){
  var d = new Date(iso + 'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  var yst = new Date(today.getTime() - 86400000);
  var t = new Date(d.getTime());
  if (t.getTime() === today.getTime()) return 'Сегодня';
  if (t.getTime() === yst.getTime()) return 'Вчера';
  var now = new Date();
  var label = d.getDate() + ' ' + MONTHS[d.getMonth()];
  if (d.getFullYear() !== now.getFullYear()) label += ' ' + d.getFullYear();
  return label;
}
function normTag(s){ return String(s||'').replace(/^#/,'').toLowerCase(); }

/* ── состояние приложения ── */
var POSTS = [];        // все посты (новые сверху)
var TAGS = [];         // [{tag, n}]
var TOPICS = null;     // [{id,title,icon,tags[]}] из topics.json (может не быть)
var view = 'feed';     // 'toc' | 'feed'
var filterTopic = null;// id выбранной темы (режим тем)
var filterMode = null; // универсальная группировка: 'months' | 'alpha' | 'kind'
var tocGroup = null;   // выбранная группа внутри filterMode
var filterTag = null;  // выбранный тег-фильтр (в виде «Лента»)
var filterQ = '';      // поисковая строка
var shown = PAGE_SIZE;

function topicOf(p){
  if (!TOPICS) return null;
  var pt = (p.tags||[]).map(normTag);
  for (var i = 0; i < TOPICS.length; i++){
    var tt = TOPICS[i].tags || [];
    for (var j = 0; j < tt.length; j++){
      if (pt.indexOf(normTag(tt[j])) !== -1) return TOPICS[i].id;
    }
  }
  return null;
}

/* ── универсальная группировка без тегов: месяцы / алфавит / тип постов ── */
var MODES = [
  {id:'months', icon:'📅', title:'По месяцам'},
  {id:'alpha',  icon:'🔤', title:'По алфавиту'},
  {id:'kind',   icon:'🎭', title:'По типу постов'}
];
var KIND_META = {
  text:{icon:'📝', title:'Тексты'}, photo:{icon:'📷', title:'Фото'},
  video:{icon:'🎬', title:'Видео'}, audio:{icon:'🎧', title:'Аудио'},
  poll:{icon:'📊', title:'Опросы'}, file:{icon:'📎', title:'Файлы'},
  sticker:{icon:'🎭', title:'Стикеры'}
};
function kindOf(p){
  if (p.kind && KIND_META[p.kind]) return p.kind;
  var t = p.title || '';
  if (t.indexOf('📷') === 0) return 'photo';
  if (t.indexOf('🎬') === 0) return 'video';
  if (t.indexOf('🎧') === 0) return 'audio';
  if (t.indexOf('📊') === 0) return 'poll';
  if (t.indexOf('📎') === 0) return 'file';
  return 'text';
}
function groupKey(p, mode){
  var md = mode || filterMode;
  if (md === 'months') return (p.date || '').slice(0,7);
  if (md === 'alpha'){
    var t = (p.title || '').replace(/^[^0-9a-zа-яё]+/i, '');
    return (t.charAt(0) || '#').toUpperCase();
  }
  return kindOf(p);
}
function monthLabel(ym){
  var m = parseInt(ym.slice(5,7), 10);
  return (MONTHS_NOM[m-1] || ym) + ' ' + ym.slice(0,4);
}
function groupCards(mode){
  var counts = {};
  POSTS.forEach(function(p){
    var k = groupKey(p, mode); if (!k) k = '#';
    if (!counts[k]) counts[k] = {key:k, n:0};
    counts[k].n++;
  });
  var arr = Object.keys(counts).map(function(k){ return counts[k]; });
  if (mode === 'months') arr.sort(function(a,b){ return a.key < b.key ? 1 : -1; });
  else if (mode === 'kind') arr.sort(function(a,b){ return b.n - a.n; });
  else arr.sort(function(a,b){ return a.key > b.key ? 1 : (a.key < b.key ? -1 : 0); });
  return arr;
}
function groupLabel(k){
  if (filterMode === 'months') return monthLabel(k);
  if (filterMode === 'kind') return (KIND_META[k] || {title:'Тексты'}).title;
  return 'На «' + k + '»';
}
function groupIcon(k){
  if (filterMode === 'months') return '📅';
  if (filterMode === 'kind') return (KIND_META[k] || {icon:'📝'}).icon;
  return k; // алфавит: буква сама — иконка
}

/* ── «По темам» (v56-ru): счётчик для карточки корня. Если темы из
   topics.json покрывают посты — считаются карточки тем (+ «Разное»),
   иначе — число тегов постов. ── */
function topicCardCount(){
  if (TOPICS){
    var n = 0, covered = 0;
    TOPICS.forEach(function(t){
      var c = 0;
      POSTS.forEach(function(p){ if (topicOf(p) === t.id) c++; });
      if (c) n++;
      covered += c;
    });
    if (covered > 0){
      var misc = POSTS.length - covered, total = n + (misc > 0 ? 1 : 0);
      return { n: total, word: pluralWord(total, ['тема','темы','тем']) };
    }
  }
  return { n: TAGS.length, word: pluralWord(TAGS.length, ['тег','тега','тегов']) };
}

/* ── фильтрация и рендер ── */
function pluralWord(n, forms){
  var a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return forms[0];
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return forms[1];
  return forms[2];
}
function plural(n){ return pluralWord(n, ['пост','поста','постов']); }
function filtered(){
  var q = filterQ.trim().toLowerCase();
  var inToc = view === 'toc' && !filterQ.trim();
  return POSTS.filter(function(p){
    if (inToc && filterTopic){
      var t = topicOf(p) || '__misc';
      if (t !== filterTopic) return false;
    } else if (inToc && filterMode && tocGroup){
      if (groupKey(p) !== tocGroup) return false;
    } else if (filterTag && !(p.tags||[]).some(function(t){ return normTag(t) === filterTag; })) return false;
    if (!q) return true;
    var hay = ((p.title||'') + ' ' + (p.preview||'') + ' ' + (p.tags||[]).join(' ')).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}
function renderChips(){
  var box = document.getElementById('chips');
  box.innerHTML = '';
  var chipAll = document.createElement('div');
  chipAll.className = 'chip' + (filterTag ? '' : ' active');
  chipAll.textContent = 'Все темы';
  chipAll.onclick = function(){ hapticSelect(); filterTag = null; shown = PAGE_SIZE; render(); };
  box.appendChild(chipAll);
  TAGS.slice(0, 14).forEach(function(t){

      shown = PAGE_SIZE; render();
    };

}

var RAW_TOPICS = null;    // содержимое topics.json (если есть)
var POSTS_READY = false;  // posts.json загружен
function tryApplyTopics(){
  if (!RAW_TOPICS || !POSTS_READY) return;
  var ts = (RAW_TOPICS && RAW_TOPICS.topics) || [];
  TOPICS = ts.filter(function(t){ return t && t.id && (t.tags||[]).length; });
  if (!TOPICS.length) TOPICS = null;
  render();   // v56-ru: темы живут внутри карточки «По темам» — корень всегда одинаковый
}
function loadTopics(){
  fetch('topics.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){ RAW_TOPICS = data; tryApplyTopics(); })
    .catch(function(){ if (POSTS_READY) render(); });   // topics.json нет/недоступен — остаётся текущий вид
}
function boot(data){
  var posts = Array.isArray(data) ? data : (data.posts || []);
  POSTS = posts.map(function(p){
    var d = String(p.date || '');
    return {
      date: d.slice(0,10), time: String(p.time || (d.length > 10 ? d.slice(11,16) : '')),
      title: p.title || '', preview: p.preview || '',
      tags: p.tags || [], kind: p.kind || '', url: p.url || ''
    };
  }).sort(function(a,b){
    var ka = a.date + ' ' + a.time, kb = b.date + ' ' + b.time;
    return ka < kb ? 1 : (ka > kb ? -1 : 0);
  });
  if (!POSTS_READY && cfg.default_view !== 'feed') view = 'toc';   // вид по умолчанию — только при первой загрузке
  var counts = {};
  POSTS.forEach(function(p){ (p.tags||[]).forEach(function(t){
    var k = normTag(t); if (!k) return;
    if (!counts[k]) counts[k] = {tag: t, n: 0};
    counts[k].n++;
  });});
  TAGS = Object.keys(counts).map(function(k){ return counts[k]; })
    .sort(function(a,b){ return b.n - a.n; });
  POSTS_READY = true;
  render();
  tryApplyTopics();
}

/* ── загрузка данных: мгновенный старт из кэша + тихое обновление ──
   posts.json после каждой успешной загрузки сохраняется в localStorage:
   на медленной сети оглавление открывается мгновенно (сохранённая копия),
   затем тихо обновляется; без сети показывается копия. */
var CACHE_KEY = 'sz_posts_v1';
function cacheRead(){
  try {
    var o = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    return (o && typeof o.raw === 'string') ? o : null;
  } catch(e){ return null; }
}
function stampFresh(t){
  if (!t) return;
  var el = document.getElementById('fresh');
  if (!el){
    el = document.createElement('div');
    el.className = 'lic'; el.id = 'fresh';
    var f = document.querySelector('footer');
    if (f) f.insertBefore(el, document.getElementById('licLine'));
  }
  var d = new Date(t), z = function(x){ return ('0' + x).slice(-2); };
  el.textContent = 'данные обновлены: ' + z(d.getDate()) + '.' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function bootFromCache(){
  var cached = cacheRead();
  if (!cached) return null;
  try {
    var cd = JSON.parse(cached.raw);
    var cn = Array.isArray(cd) ? cd.length : ((cd && cd.posts) ? cd.posts.length : 0);
    if (cn) { boot(cd); stampFresh(cached.t); }   // пустой кэш не показываем — пусть решает сеть
    return cached;
  } catch(e){ return null; }
}
function load(){
  var cached = bootFromCache();
  fetch('posts.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(txt){
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({t: Date.now(), raw: txt})); } catch(e){}
      if (cached && txt === cached.raw){ stampFresh(Date.now()); return; }   // данные не изменились
      boot(JSON.parse(txt));
      stampFresh(Date.now());
    })
    .catch(function(e){
      if (!POSTS_READY) renderState('error', 'Файл posts.json недоступен или пуст. Проверьте настройку по гайду (' + e.message + ').');
    });
}

        + '@' + esc(sub.channel) + (sub.title ? ' · ' + esc(sub.title) : '') + '</div>');
    }
    if (st === 'trial' || st === 'paid') {
      b.push('<div style="font-size:15px;margin:6px 0 2px;opacity:.85">'
        + esc(daysLine(sub.days_left || 0, sub.ends_str)) + '</div>');
      var meta = [];
      if (sub.started_str) meta.push(TXT.with_us.replace('{d}', sub.started_str));
      if (sub.months) meta.push(TXT.months.replace('{n}', sub.months));
      if (meta.length) b.push(para(esc(meta.join(' · '))));
    }
    if (body) b.push(para(esc(body)));
    if (primary && primary[0]) b.push(btn(primary[0], primary[1], true));
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][0]) b.push(btn(rows[i][0], rows[i][1], false));
    }
    if (sub.has) {
      b.push('<div style="font-size:15px;font-weight:600;margin:22px 0 2px">'
        + esc(TXT.hist) + '</div>');
      if (sub.log_total) {
        b.push('<div style="font-size:13px;opacity:.65;margin:0 0 4px">'
          + esc(TXT.hist_meta.replace('{n}', String(sub.paid_total || 0))
            .replace('{k}', String(sub.log_total))) + '</div>');
      }
      if (sub.log && sub.log.length) {
        for (var j = sub.log.length - 1; j >= 0; j--) {
          b.push('<div style="display:flex;justify-content:space-between;gap:12px;'
            + 'padding:9px 0;border-bottom:1px solid ' + LINE + ';font-size:14px">'
            + '<span style="opacity:.7;white-space:nowrap">' + esc(sub.log[j].d) + '</span>'
            + '<span style="text-align:right">' + esc(sub.log[j].label) + '</span></div>');
        }
        if (sub.log_total > sub.log.length) {
          b.push('<div style="font-size:13px;opacity:.6;margin-top:6px">'
            + esc(TXT.hist_more.replace('{n}', String(sub.log.length))
              .replace('{m}', String(sub.log_total))) + '</div>');
        }
      } else {
        b.push('<div style="font-size:14px;opacity:.6">' + esc(TXT.hist_empty) + '</div>');
      }
    }
    /* Task 130: лицензии продуктовой ветки — те же данные, что «Проверить
       свою лицензию» в боте; без лицензий блок не показывается вовсе. */
    var licItems = (d.lic && d.lic.items) || [];
    if (licItems.length) {
      b.push('<div style="font-size:15px;font-weight:600;margin:22px 0 4px">'
        + esc(TXT.lic) + '</div>');
      for (var k = 0; k < licItems.length; k++) {
        var it = licItems[k];
        b.push('<div style="padding:9px 0;border-bottom:1px solid ' + LINE + ';font-size:14px">'
          + '<div>' + esc(it.tier) + '</div>'
          + '<div style="opacity:.75;margin-top:2px">№ ' + esc(it.lic_id)
          + ' · ' + esc(it.branch) + ' · v' + esc(it.ver) + '</div>'
          + '<div style="margin-top:2px;font-size:13px;color:'
          + (it.fresh ? (dark ? '#34D399' : '#15803D') : ACC) + '">'
          + esc(it.fresh ? TXT.lic_fresh
            : TXT.lic_upd.replace('{v}', String((d.lic && d.lic.cur) || '')))
          + '</div></div>');
      }
    }
    /* Task 147: блок «Партнёрка» переехал в отдельную вкладку (refBody) —
       главный экран остаётся про статус, историю, лицензии и акции. */
    /* Task 130: поделиться ботом и скопировать текстовую сводку. */
    if (d.bot_link) {
      b.push(btn('https://t.me/share/url?url=' + encodeURIComponent(d.bot_link)
        + '&text=' + encodeURIComponent(TXT.share_txt), TXT.share, false));
    }
    b.push('<a href="#" id="szc-copy" style="display:block;text-decoration:none;'
      + 'text-align:center;margin:10px 0;padding:13px 14px;border-radius:12px;'
      + 'background:' + CARD + ';color:inherit">' + esc(TXT.copy) + '</a>');
    b.push('<div style="font-size:13px;opacity:.55;margin-top:22px">' + esc(TXT.noauto) + '</div>');
    if (d.support) {
      b.push('<div style="font-size:14px;margin-top:8px">'
        + esc(TXT.support).replace('{s}', '<a href="https://t.me/'
          + esc(String(d.support).replace(/^@+/, '')) + '" data-ext="1" style="color:inherit;font-weight:600">'
          + esc(d.support) + '</a>') + '</div>');
    }
    b.push('</div>');
    return b.join('');
  }
  /* Task 147: вкладка «Реферальная программа» — персональная ссылка, полная
     воронка (переходы → приглашено → триалы → оплаты → награды), тир,
     купоны-награды, приглашения; владельцу — общая сводка (/refstats).
     Пустой d.ref → честный пустой экран, кабинет не падает. */
  function refBody(d) {
    var rf = (d && d.ref) || null;
    var b = ['<div style="' + PAD + '">'];
    if (d.user && d.user.name) {
      b.push('<div style="font-size:15px;opacity:.65;margin-bottom:14px">'
        + esc(TXT.hello.replace('{n}', d.user.name)) + '</div>');
    }
    b.push(tabbar());
    b.push('<div style="font-size:23px;font-weight:700;letter-spacing:.2px">'
      + esc(TXT.tab_ref) + '</div>');
    if (!rf || !rf.link) {
      b.push(para(esc(TXT.ref_empty)));
      if (d.bot_link) b.push(btn(d.bot_link, TXT.ref_in_bot, false));
      b.push('</div>');
      return b.join('');
    }
    b.push('<div style="font-size:15px;font-weight:600;margin:14px 0 4px">'
      + esc(TXT.ref_link_l) + '</div>');
    b.push('<div style="background:' + CARD + ';border-radius:12px;padding:12px 14px;'
      + 'font-size:13px;word-break:break-all;font-family:ui-monospace,Menlo,monospace">'
      + esc(rf.link) + '</div>');
    b.push('<div style="font-size:15px;font-weight:600;margin:20px 0 2px">'
      + esc(TXT.ref_funnel_t) + '</div>');
    var fn = [[TXT.ref_clicks_l, rf.clicks], [TXT.ref_invited_l, rf.invited],
              [TXT.ref_trials_l, rf.trials], [TXT.ref_paid_l, rf.paid],
              [TXT.ref_rewards_l, rf.rewards], [TXT.ref_pending_l, rf.pending]];
    var anyData = false;
    for (var fi = 0; fi < fn.length; fi++) {
      anyData = anyData || (fn[fi][1] > 0);
      b.push('<div style="display:flex;justify-content:space-between;gap:12px;'
        + 'padding:9px 0;border-bottom:1px solid ' + LINE + ';font-size:14px">'
        + '<span style="opacity:.75">' + esc(fn[fi][0]) + '</span>'
        + '<span style="font-weight:600">' + esc(String(fn[fi][1] || 0)) + '</span></div>');
    }
    if (!anyData) b.push('<div style="font-size:13px;opacity:.6;margin-top:8px">'
      + esc(TXT.ref_empty) + '</div>');
    b.push('<div style="font-size:13px;color:' + ACC + ';margin-top:10px">'
      + esc((rf.next_left ? TXT.ref_tier : TXT.ref_tier_max)
        .replace('{t}', String(rf.tier || 1))
        .replace('{n}', String(rf.next_left || 0))) + '</div>');
    var rcp = rf.coupons || [];
    if (rcp.length) {
      b.push('<div style="font-size:14px;font-weight:600;margin-top:10px">'
        + esc(TXT.ref_coupons) + '</div>');
      for (var rcq = 0; rcq < rcp.length; rcq++) {
        b.push('<div style="padding:8px 0;border-bottom:1px solid ' + LINE
          + ';font-size:14px">' + esc(TXT.ref_coupon
            .replace('{code}', String(rcp[rcq].code || '—'))
            .replace('{p}', String(rcp[rcq].percent || 0))
            .replace('{d}', String(rcp[rcq].expires || '—'))) + '</div>');
      }
    }
    var rin = rf.invites || [];
    if (rin.length) {
      b.push('<div style="font-size:14px;font-weight:600;margin-top:10px">'
        + esc(TXT.ref_invites) + '</div>');
      for (var rvq = 0; rvq < rin.length; rvq++) {
        var stq = String(rin[rvq].status || 'registered');
        var stl = TXT['ref_st_' + stq] || stq;
        b.push('<div style="padding:6px 0;border-bottom:1px solid ' + LINE
          + ';font-size:14px;opacity:.85">' + esc(String(rin[rvq].name || '—')
            + ' — ' + stl) + '</div>');
      }
    }
    var adm = rf.admin || null;
    if (adm) {
      b.push('<div style="font-size:15px;font-weight:600;margin:22px 0 2px">'
        + esc(TXT.ref_adm_t) + '</div>');
      b.push('<div style="font-size:12px;opacity:.55;margin:0 0 4px">'
        + esc(TXT.ref_adm_hint) + '</div>');
      var per = [[TXT.ref_adm_7d, adm.d7], [TXT.ref_adm_30d, adm.d30]];
      for (var pi = 0; pi < per.length; pi++) {
        var bb = per[pi][1] || {};
        b.push('<div style="padding:9px 0;border-bottom:1px solid ' + LINE + ';font-size:14px">'
          + '<div style="font-weight:600">' + esc(per[pi][0]) + '</div>'
          + '<div style="font-size:13px;opacity:.8;margin-top:2px">'
          + esc(TXT.ref_adm_line
            .replace('{c}', String(bb.clicks || 0)).replace('{r}', String(bb.reg || 0))
            .replace('{t}', String(bb.trials || 0)).replace('{p}', String(bb.paid || 0))
            .replace('{g}', String(bb.granted || 0)).replace('{x}', String(bb.revoked || 0)))
          + '</div></div>');
      }
      if (adm.conv) {
        b.push('<div style="display:flex;justify-content:space-between;gap:12px;'
          + 'padding:9px 0;border-bottom:1px solid ' + LINE + ';font-size:14px">'
          + '<span style="opacity:.75">' + esc(TXT.ref_adm_conv) + '</span>'
          + '<span style="font-weight:600">' + esc(adm.conv) + '</span></div>');
      }
      var top = adm.top || [];
      if (top.length) {
        b.push('<div style="font-size:14px;font-weight:600;margin-top:10px">'
          + esc(TXT.ref_adm_top) + '</div>');
        for (var qi = 0; qi < top.length; qi++) {
          b.push('<div style="padding:6px 0;border-bottom:1px solid ' + LINE
            + ';font-size:14px;opacity:.85">' + esc(TXT.ref_adm_top_row
              .replace('{id}', String(top[qi].id || '—'))
              .replace('{k}', String(top[qi].paid || 0))) + '</div>');
        }
      }
      if (adm.review > 0) {
        b.push('<div style="display:flex;justify-content:space-between;gap:12px;'
          + 'padding:9px 0;border-bottom:1px solid ' + LINE + ';font-size:14px;color:'
          + ACC + '"><span>' + esc(TXT.ref_adm_review) + '</span>'
          + '<span style="font-weight:600">' + esc(String(adm.review)) + '</span></div>');
      }
      b.push('<div style="display:flex;justify-content:space-between;gap:12px;'
        + 'padding:9px 0;font-size:14px"><span style="opacity:.75">'
        + esc(TXT.ref_adm_granted_t) + '</span>'
        + '<span style="font-weight:600">' + esc(String(adm.granted || 0)) + '</span></div>');
    }
    b.push(btn('https://t.me/share/url?url=' + encodeURIComponent(rf.link)
      + '&text=' + encodeURIComponent(TXT.ref_share_txt), TXT.ref_share, false));
    b.push('<a href="#" id="szc-refcopy" style="display:block;text-decoration:none;'
      + 'text-align:center;margin:10px 0;padding:13px 14px;border-radius:12px;'
      + 'background:' + CARD + ';color:inherit">' + esc(TXT.ref_copy) + '</a>');
    if (d.bot_link) b.push(btn(d.bot_link, TXT.ref_in_bot, false));
    b.push('</div>');
    return b.join('');
  }
  function renderError(diag) {
    diag = diag || {};
    /* Task 132: три честных экрана вместо обезличенной ошибки + код для
       диагностики по скриншоту: HTTP-статус / why / есть ли initData и токен. */
    var noctx = !diag.init && !diag.tok;
    var stale = (diag.why === 'stale' || diag.why === 'token_stale');
    var t1 = noctx ? TXT.ctx_t : (stale ? TXT.stale_t : TXT.err_t);
    var m1 = noctx ? TXT.ctx_m : (stale ? TXT.stale_m : TXT.err_m);
    ov.innerHTML = '<div style="' + PAD + '">' + bar('#a34040')
      + '<div style="font-size:23px;font-weight:700">' + esc(t1) + '</div>'
      + '<div style="font-size:15px;opacity:.85;margin:8px 0 16px">' + esc(m1) + '</div>'
      + '<a href="#" id="szc-retry" style="display:block;text-align:center;padding:13px 14px;'
      + 'border-radius:12px;background:' + ACC + ';color:#fffdf8;font-weight:600;'
      + 'text-decoration:none">' + esc(TXT.retry) + '</a>'
      + '<div style="font-size:11px;opacity:.4;margin-top:16px;font-family:ui-monospace,Menlo,monospace">'
      + esc('code ' + (diag.http || 0) + ' · ' + (diag.why || 'net')
        + ' · init=' + (diag.init ? 'yes' : 'no')
        + ' · tok=' + (diag.tok ? 'yes' : 'no')) + '</div></div>';
    var r = document.getElementById('szc-retry');
    if (r) r.addEventListener('click', function (ev) { ev.preventDefault(); haptic('light'); load(); });
  }
  function load() {
    ov.innerHTML = '<div style="' + PAD + 'display:flex;align-items:center;'
      + 'justify-content:center;min-height:70vh">'
      + '<div style="width:34px;height:34px;border-radius:50%;'
      + 'border:3px solid rgba(154,107,21,.25);border-top-color:' + ACC + ';'
      + '-webkit-animation:szc .9s linear infinite;animation:szc .9s linear infinite"></div>'
      + '<style>@-webkit-keyframes szc{to{-webkit-transform:rotate(360deg)}}'
      + '@keyframes szc{to{transform:rotate(360deg)}}</style></div>';
    var init = (w && w.initData) || '';
    var diag0 = { init: init ? 1 : 0, tok: cabTok ? 1 : 0 };
    function dthrow(http, why) {
      throw { http: http, why: why, init: diag0.init, tok: diag0.tok };
    }
    var body = init ? { initData: init }
      : (cabTok ? { cab_token: cabTok } : { initData: '' });
    fetch(API + '/api/cabinet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) {
        return r.json().catch(function () { return null; }).then(function (j) {
          dthrow(r.status, (j && j.why) || '');
        });
      }
      return r.json().then(function (d) {
        if (!d || !d.ok) dthrow(r.status, 'payload');
        render(d);
      });
    }).catch(function (e) {
      if (e && typeof e.http === 'number') { renderError(e); return; }
      renderError({ http: 0, why: 'net', init: diag0.init, tok: diag0.tok });
    });
  }
  ov.addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== ov && !(t.tagName === 'A' && t.getAttribute('data-ext') === '1')) {
      t = t.parentNode;
    }
    if (!t || t === ov) return;
    haptic('light');
    var href = t.getAttribute('href') || '';
    if (w && w.openTelegramLink && /^https:\/\/t\.me\//.test(href)) {
      ev.preventDefault();
      w.openTelegramLink(href);
    }
  });
  load();
})();
</script>

</body>
</html>
